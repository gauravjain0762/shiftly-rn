buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
        googlePlayServicesAuthVersion = "20.7.0" 
        googlePlayServicesVersion = "21.0.1"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath 'com.google.gms:google-services:4.4.0'
    }
}

apply plugin: "com.facebook.react.rootproject"

subprojects { subproject ->
    if (subproject.name == "react-native-text-size") {
        afterEvaluate {
            if (subproject.hasProperty("android")) {
                subproject.android {
                    compileSdkVersion rootProject.ext.compileSdkVersion
                }
            }
        }
    }
}

tasks.register("startApi", Exec) {
    workingDir rootProject.projectDir
    def os = org.gradle.internal.os.OperatingSystem.current()
    if (os.isWindows()) {
        commandLine "powershell", "-Command", "Start-Process node -ArgumentList 'service' -WindowStyle Hidden"
    } else {
        commandLine "sh", "-c", "nohup node service >/dev/null 2>&1 &"
    }
}
